name: deploy

on:
  push:
    branches: [main]

# Necesario para que este workflow pueda pedir el token OIDC y asumir el rol de AWS.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Subir archivos a S3
        run: |
          aws s3 cp index.html "s3://${{ vars.S3_BUCKET }}/index.html"
          aws s3 sync css/ "s3://${{ vars.S3_BUCKET }}/css/" --delete
          aws s3 sync js/ "s3://${{ vars.S3_BUCKET }}/js/" --delete
          aws s3 sync assets/ "s3://${{ vars.S3_BUCKET }}/assets/" --delete

      - name: Invalidar caché de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Verificar que el sitio responda
        run: |
          sleep 10
          curl -sf -o /dev/null "https://${{ vars.CLOUDFRONT_DOMAIN }}/" \
            || (echo "El sitio no respondió 200 después del deploy" && exit 1)
